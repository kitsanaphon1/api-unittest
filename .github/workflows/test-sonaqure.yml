name: SonarCloud Scan with Coverage

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - run: dotnet restore WebApiProject/WebApiProject.csproj

      - run: dotnet build WebApiProject/WebApiProject.csproj --no-restore --configuration Release

      - run: |
          dotnet test WebApiProject.Tests/WebApiProject.Tests.csproj \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults

      - uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectBaseDir=WebApiProject
            -Dsonar.sources=.
            -Dsonar.exclusions=**/bin/**,**/obj/**
            -Dsonar.cs.opencover.reportsPaths=../TestResults/**/coverage.cobertura.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
