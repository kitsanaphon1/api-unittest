name: Build, Scan & Manual Push Docker Image

on:
  workflow_dispatch:   # ✅ เริ่มแบบ Manual เพื่อทดสอบ ไม่รันอัตโนมัติ
  push:
    branches: [dev]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore WebApiProject/WebApiProject.csproj

      - name: Build Test Project
        run: dotnet build WebApiProject.Tests/WebApiProject.Tests.csproj --configuration Debug

      - name: Run Unit Tests and Collect Coverage
        run: |
          mkdir -p TestResults
          dotnet test WebApiProject.Tests/WebApiProject.Tests.csproj \
            --results-directory TestResults \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --verbosity normal

      - name: Install ReportGenerator tool
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate HTML Test Coverage Report
        run: |
          ~/.dotnet/tools/reportgenerator \
            -reports:TestResults/**/coverage.cobertura.xml \
            -targetdir:TestResults/report \
            -reporttypes:Html

      - name: Upload HTML Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-test-report
          path: TestResults/report

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t api-unittest:latest -f WebApiProject/Dockerfile WebApiProject

      - name: Scan with Trivy (SARIF for Dashboard)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-unittest:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Scan to GitHub Dashboard
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: ⚠️ Scan CRITICAL (do not fail workflow)
        run: |
          trivy image --severity CRITICAL --exit-code 1 --no-progress api-unittest:latest || true

  push-image:
    needs: build-and-scan
    runs-on: ubuntu-latest
    environment:
      name: production  # ✅ คุณต้องไป Settings > Environments > สร้าง 'production' + ตั้ง Reviewer
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Image
        run: docker tag api-unittest:latest sooyaa02/api-unittest:latest

      - name: Push Docker Image
        run: docker push sooyaa02/api-unittest:latest

      - name: Send Mail Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ CI/CD Pipeline Succeeded"
          to: chol.www02@gmail.com
          from: GitHub CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            ✅ All CI steps completed successfully.
            - Unit Tests passed
            - Docker Image built and pushed
            - Trivy scan completed (CRITICAL may exist)
            - Image: sooyaa02/api-unittest:latest
